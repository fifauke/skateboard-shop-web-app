services:
  db:
    image: paint-database
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: paint-database-container
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: paint
      POSTGRES_USER: paint_user
      POSTGRES_DB: PAINT_database
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - PAINTnet

  backend:
    image: paint-backend
    build:
      context: "./backend/essask8/essask8"
      dockerfile: Dockerfile
    container_name: paint-backend-container
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/PAINT_database
      SPRING_DATASOURCE_USERNAME: paint_user
      SPRING_DATASOURCE_PASSWORD: paint
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads 
    networks:
      - PAINTnet

  frontend:
    image: paint-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paint-frontend-container
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true 
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  db_data:
  frontend_node_modules:

networks:
  PAINTnet:
    name: PAINTnet
    driver: bridge
